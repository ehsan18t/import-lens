[package]
name = "import-lens-daemon"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "import-lens-daemon"
path = "src/main.rs"

[dependencies]
brotli = "^8"
bytes = "^1"
# Coordinated compiler stack, exact-pinned: this is the matcher Rolldown itself
# reads `sideEffects` globs with (`rolldown_common`, `rolldown_utils`). Its whole
# purpose is to AGREE with the bundler that owns retention, so resolving it to a
# different version than rolldown got would break that agreement silently. Moved
# only by `pnpm deps:update:compiler`, which derives it from rolldown's own graph.
fast-glob = "=1.1.2"
flate2 = "^1.1"
futures-util = { version = "^0.3", default-features = false, features = ["sink", "std"] }
httpdate = "^1"
# Allocator. glibc malloc keeps each worker thread's peak resident after the build that
# grew it. mimalloc only beats that with transparent huge pages off (`no_thp`) and
# purging on free (set in main.rs); idle threads also collect their heaps (`reclaim`).
libmimalloc-sys = { version = "^0.1", default-features = false, features = ["extended", "no_thp"] }
mimalloc = { version = "^0.1", default-features = false }
# CSS processor, a standalone exact pin (not derived from rolldown's graph): it processes
# a package's CSS the way it ships (resolve `@import`s, minify) so the reported size is
# right, which means a version bump can silently move CSS numbers. `bundler` gives
# parse + `@import` + minify; `browserslist` stays OFF so output is deterministic and
# target-free. It has only ever shipped `1.0.0-alpha.*`, and the API breaks between
# alphas, so the exact pin is load-bearing.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler"] }
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_codegen = "=0.152.0"
oxc_minifier = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_resolver = "=11.24.3"
oxc_semantic = "=0.152.0"
oxc_span = "=0.152.0"
oxc_syntax = "=0.152.0"
papaya = "^0.2"
rayon = "^1.12"
redb = "^4"
rmp-serde = "^1.3"
rolldown = "=1.2.12"
rolldown_common = "=1.2.12"
rolldown_error = "=1.2.12"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1.52", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-util = { version = "^0.7", features = ["codec"] }
ureq = { version = "^3.3", default-features = false, features = ["rustls"] }
xxhash-rust = { version = "^0.8", features = ["xxh3"] }
zstd = "^0.13"

# On Linux the C dependencies (zstd) allocate through glibc malloc, whose per-thread arenas keep
# freed memory resident outside anything idle reclaim collects; mimalloc overrides malloc there.
# A static Windows build cannot override it, and the Windows heap does not keep per-thread arenas.
[target.'cfg(target_os = "linux")'.dependencies]
libmimalloc-sys = { version = "^0.1", default-features = false, features = ["extended", "no_thp", "override"] }

[dev-dependencies]
zip = "^2"

[lints]
workspace = true
